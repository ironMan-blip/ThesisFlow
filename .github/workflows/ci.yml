name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: thesisflow
          POSTGRES_PASSWORD: thesisflow
          POSTGRES_DB: thesisflow_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U thesisflow" --health-interval 2s --health-retries 20
    # Throwaway values for the CI-only database; CI has no .env.
    env:
      DATABASE_URL: postgresql+psycopg://thesisflow:thesisflow@localhost:5432/thesisflow_test
      TEST_DATABASE_URL: postgresql+psycopg://thesisflow:thesisflow@localhost:5432/thesisflow_test
      JWT_SECRET: ci-only-secret
      ADMIN_EMAIL: coordinator@thesisflow.test
      ADMIN_ID_NUMBER: "00000000"
      ADMIN_PASSWORD: CiOnly-Pass1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
