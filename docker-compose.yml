services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: thesisflow
    # No host port: avoids clashing with a local Postgres. Use `docker compose exec db psql -U thesisflow`.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # No host port, like db. Saved to a volume so known login IPs survive restarts.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/thesisflow
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/thesisflow_test
      # Separate Redis database: tests wipe it before each test.
      TEST_REDIS_URL: redis://redis:6379/1
    # No host port: the backend trusts X-Forwarded-For (see Dockerfile), so only the frontend's proxy may reach it,
    # else any local process could pick its own IP and dodge rate limits. Swagger is proxied at :5174/docs.
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      # Optional: without Redis the backend keeps rate limits in memory (app.rate_limit).
      redis:
        condition: service_started
        required: false

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://backend:8000
    # Localhost only: other machines on the network can't reach the app, Swagger or the Vite dev server.
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  frontend_node_modules:
